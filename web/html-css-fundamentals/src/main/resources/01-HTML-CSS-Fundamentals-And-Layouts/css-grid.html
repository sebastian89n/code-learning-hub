<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CSS Grid</title>
    <style>
        /* ------------------------------------------------------
           CSS GRID QUICK REFERENCE
        ---------------------------------------------------------
           GRID TERMINOLOGY
        ---------------------------------------------------------
        grid lines → Invisible horizontal/vertical lines defining the structure
        grid track → A single row or column between two grid lines
        grid cell → The smallest unit (intersection of a row and column)
        grid area → A rectangular group of one or more grid cells
        gutters → Space between rows/columns (set via row-gap / column-gap)
        implicit grid → Tracks automatically created by the browser when needed
        explicit grid → Tracks defined by grid-template-rows / columns
        ---------------------------------------------------------
           GRID CONTAINER PROPERTIES
        ---------------------------------------------------------
        display: grid | inline-grid
            ? Turns element into a grid container

        grid-template-columns / grid-template-rows: <track-size>...
            ? Define explicit rows and columns (e.g. 200px 1fr auto)

        grid-template-areas:
            ? Define named areas (used with grid-area on children)

        grid-template: <rows> / <columns>
            ? Shorthand for rows, columns, and areas

        grid-auto-rows / grid-auto-columns: <track-size>
            ? Define size of implicitly created tracks

        grid-auto-flow: row | column | row dense | column dense (default: row)
            ? Control how auto-placed items fill the grid

        gap: <length> (default: 0)
        row-gap: <length>
        column-gap: <length>
            ? Space between rows/columns (gutters)

        justify-content: start | end | center | space-between | space-around | space-evenly | stretch
            ? Align entire grid within the container horizontally (main axis)

          align-content: start | end | center | space-between | space-around | space-evenly | stretch
            ? Align entire grid within the container vertically (cross axis)

        justify-items: start | end | center | stretch (default: stretch)
            ? Align items within their cells horizontally

        align-items: start | end | center | stretch (default: stretch)
            ? Align items within their cells vertically

        place-items: <align-items> / <justify-items>
            ? Shorthand for item alignment

        place-content: <align-content> / <justify-content>
            ? Shorthand for content alignment
        ---------------------------------------------------------
           GRID ITEM PROPERTIES
        ---------------------------------------------------------
        grid-column-start / grid-column-end: <line> | span <n>
        grid-row-start / grid-row-end: <line> | span <n>
            ? Define item’s position and span across grid lines

        grid-column: <start> / <end>
        grid-row: <start> / <end>
            ? Shorthand for start/end values

        grid-area: <name> | <row-start> / <column-start> / <row-end> / <column-end>
            ? Reference a named area or manually set all four positions

        justify-self: start | end | center | stretch (default: stretch)
        align-self: start | end | center | stretch (default: stretch)
        place-self: <align-self> / <justify-self>
            ? Override alignment for a single item

        order (not supported in grid)
            ? Grid uses explicit placement, not source order manipulation
        ---------------------------------------------------------
           COMMON FUNCTIONS & UNITS
        ---------------------------------------------------------
        fr → Fractional unit (e.g. 1fr = portion of available space)
        repeat(n, value) → Repeat track definitions (e.g. repeat(3, 1fr))
        minmax(min, max) → Flexible track sizing (e.g. minmax(150px, 1fr))
        auto-fit / auto-fill → Dynamic columns in repeat() for responsive layouts
        ---------------------------------------------------------
        */

        .el--1 {
            background-color: blueviolet;
        }

        .el--2 {
            background-color: orangered;
            /* Span multiple columns:  grid-column: 1 / span 3; */
            /* Span from first to last:  grid-column: 1 / -1; */
            grid-column: 1;
            /* Same can be applied to rows */
            grid-row: 2;
        }

        .el--3 {
            /* Override container properties */
            align-self: flex-end;
            justify-self: flex-end;

            background-color: green;
            height: 150px;
        }

        .el--4 {
            background-color: goldenrod;
        }

        .el--5 {
            background-color: palevioletred;
        }

        .el--6 {
            background-color: steelblue;
        }

        .el--7 {
            background-color: yellow;
        }

        .el--8 {
            background-color: crimson;
            /* Start at column 2 and end with column 3 */
            grid-column: 2 / 3;
            /* Start at row 1 and end with row 2 */
            grid-row: 1 / 2;

        }

        .container--1 {
            /* STARTER */
            font-family: sans-serif;
            background-color: #ddd;
            font-size: 30px;
            margin: 40px;

            /* CSS GRID */
            display: grid;
            /*grid-template-columns: 200px 200px 1fr 1fr;*/
            /*grid-template-columns: 2fr 1fr 1fr auto;*/
            /*grid-template-rows: 300px 200px;*/

            /* often it is better to define columns only and have rows create automatically */
            grid-template-columns: repeat(4, 1fr);

            /*height: 500px;*/
            grid-template-rows: 1fr 1fr;

            /*grid-gap was used in the past, then it was replaced with gap(like in Flexbox)*/
            /*gap: 30px;*/
            column-gap: 20px;
            row-gap: 40px;
        }

        .container--2 {
            font-family: sans-serif;
            background-color: black;
            font-size: 40px;
            margin: 40px;

            width: 700px;
            height: 600px;

            display: grid;
            grid-template-columns: 125px 200px 125px;
            grid-template-rows: 250px 100px;
            gap: 50px;

            /* Aligning tracks inside container: distribute empty space */
            /*justify-content: space-between;*/
            justify-content: center;
            align-content: center;

            /* Aligning items INSIDE cells: moving items around inside cells */
            align-items: center;
            justify-items: center;
        }
    </style>
  </head>
  <body>
    <div class="container--1">
      <div class="el el--1">(1) HTML</div>
      <div class="el el--2">(2) and</div>
      <div class="el el--3">(3) CSS</div>
      <div class="el el--4">(4) are</div>
      <div class="el el--5">(5) amazing</div>
      <div class="el el--6">(6) languages</div>
      <!--      <div class="el el&#45;&#45;7">(7) to</div>-->
      <div class="el el--8">(8) learn</div>
    </div>

    <div class="container--2">
      <div class="el el--1">(1)</div>
      <div class="el el--3">(3)</div>
      <div class="el el--4">(4)</div>
      <div class="el el--5">(5)</div>
      <div class="el el--6">(6)</div>
      <div class="el el--7">(7)</div>
    </div>
  </body>
</html>
