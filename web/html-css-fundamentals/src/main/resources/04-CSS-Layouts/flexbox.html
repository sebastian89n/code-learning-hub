<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Flexbox</title>
    <style>
        /* ------------------------------------------------------
FLEXBOX QUICK REFERENCE
------------------------------------------------------
FLEX CONTAINER PROPERTIES
------------------------------------------------------
gap: <length>
→ Space between items (no margin needed)

justify-content: flex-start | flex-end | center | space-between | space-around | space-evenly
→ Align items along MAIN axis (horizontal by default)

align-items: stretch | flex-start | flex-end | center | baseline
→ Align items along CROSS axis (vertical by default)

flex-direction: row | row-reverse | column | column-reverse
→ Defines the MAIN axis

flex-wrap: nowrap | wrap | wrap-reverse
→ Allow items to wrap into a new line if too large

align-content: stretch | flex-start | flex-end | center | space-between | space-around
→ Aligns multiple lines (only when flex-wrap is used)
------------------------------------------------------
FLEX ITEM PROPERTIES
------------------------------------------------------
align-self: auto | stretch | flex-start | flex-end | center | baseline
→ Override align-items for a single item

flex-grow: <integer>
→ Allow item to grow (0 = no, 1+ = yes)

flex-shrink: <integer>
→ Allow item to shrink (0 = no, 1+ = yes)

flex-basis: auto | <length>
→ Define initial size instead of width

flex: <grow> <shrink> <basis>
→ Shorthand (recommended)

order: <integer>
→ Controls item order (0 is default, you can force your own order by changing values, e.g. -1 = first, 1 = last)
------------------------------------------------------ */
        .el--1 {
            background-color: blueviolet;
        }

        .el--2 {
            background-color: orangered;
        }

        .el--3 {
            background-color: green;
            height: 150px;
        }

        .el--4 {
            background-color: goldenrod;
        }

        .el--5 {
            background-color: palevioletred;
        }

        .el--6 {
            background-color: steelblue;
        }

        .el--7 {
            background-color: yellow;
        }

        .el--8 {
            background-color: crimson;
        }

        .container {
            /* STARTER */
            font-family: sans-serif;
            background-color: #ddd;
            font-size: 32px;
            margin: 40px;

            /* FLEXBOX - by default all elements have a height of the highest element */
            display: flex;

            align-items: center;
            justify-content: flex-start;
            gap: 10px;
        }

        .el {
            /*margin-right: 30px;*/

            /* DEFAULT
            flex-grow:0;
            flex-shrink: 1;
            flex-basis: auto;
             */

            /*
            flex-basis: 10px;
            flex-shrink: 0;
            flex-grow: 1;
            flex: 1;
            */
            flex: 1 1 auto;
        }

        .el--1 {
            align-self: flex-start;
            /*flex-grow: 3; <- will grow this element 3x */
            /*order: 2;*/
        }

        .el--5 {
            align-self: stretch;
            order: 1;
        }

        .el--6 {
            order: -1;
        }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="el el--1">HTML</div>
      <div class="el el--2">and</div>
      <div class="el el--3">CSS</div>
      <div class="el el--4">are</div>
      <div class="el el--5">amazing</div>
      <div class="el el--6">languages</div>
<!--      <div class="el el&#45;&#45;7">to</div>-->
<!--      <div class="el el&#45;&#45;8">learn</div>-->
    </div>
  </body>
</html>
