<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Table Component</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
          rel="stylesheet">

    <style>
        /*
        SPACING SYSTEM (px)
        2 / 4 / 8 / 12 / 16 / 24 / 32 / 48 / 64 / 80 / 96 / 128

        FONT SIZE SYSTEM (px)
        10 / 12 / 14 / 16 / 18 / 20 / 24 / 30 / 36 / 44 / 52 / 62 / 74 / 86 / 98

        MAIN COLOR: #087f5b
        GREY COLOR: #343a40
        */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            color: #343a40;
            font-family: 'Inter', sans-serif;

            display: flex;
            justify-content: center;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        /* CONTROLS */
        .pagination-btn {
            background-color: #fff;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            height: 24px;
            width: 24px;
        }

        .pagination-btn-selected, .pagination-btn-arrow:hover {
            color: #fff;
            background-color: #087f5b;
        }

        .pagination-btn-arrow {
            border: 1px solid #087f5b;
            color: #087f5b;

            height: 32px;
            width: 32px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pagination-btn-arrow-icon {
            height: 12px;
            width: 12px;

            stroke-width: 1.5;
        }
    </style>
  </head>
  <body>
    <div class="pagination">
      <button class="pagination-btn pagination-btn-arrow">
        <svg class="pagination-btn-arrow-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
        </svg>
      </button>
      <button class="pagination-btn">1</button>
      <button class="pagination-btn">2</button>
      <button class="pagination-btn pagination-btn-selected">3</button>
      <button class="pagination-btn">4</button>
      <button class="pagination-btn">5</button>
      <button class="pagination-btn">6</button>
      <button class="pagination-btn">...</button>
      <button class="pagination-btn">23</button>
      <button class="pagination-btn pagination-btn-arrow">
        <svg class="pagination-btn-arrow-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
        </svg>
      </button>
    </div>
  </body>
</html>
