<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Table Component</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
          rel="stylesheet">

    <style>
        /*
        SPACING SYSTEM (px)
        2 / 4 / 8 / 12 / 16 / 24 / 32 / 48 / 64 / 80 / 96 / 128

        FONT SIZE SYSTEM (px)
        10 / 12 / 14 / 16 / 18 / 20 / 24 / 30 / 36 / 44 / 52 / 62 / 74 / 86 / 98

        MAIN COLOR: #087f5b
        GREY COLOR: #343a40
        */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            color: #343a40;
            font-family: 'Inter', sans-serif;

            display: flex;
            justify-content: center;
            line-height: 1;
        }

        /* CONTROLS */
        .pagination {
            display: flex;
            align-items: center;
            margin-top: 200px;
            gap: 12px;
        }

        .pagination-btn {
            background: none;
            border: 1px solid #087f5b;
            border-radius: 50%;
            color: #087f5b;
            cursor: pointer;
            height: 48px;
            width: 48px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pagination-btn:hover {
            background-color: #087f5b;
        }

        .pagination-btn:hover > .pagination-btn-icon {
            stroke: #fff;
        }

        .pagination-btn-icon {
            height: 24px;
            width: 24px;
            stroke: #087f5b;
        }

        .page-link:link, .page-link:visited {
            border-radius: 50%;
            font-size: 18px;
            color: #343a40;
            text-decoration: none;

            display: flex;
            align-items: center;
            justify-content: center;

            height: 36px;
            width: 36px;
        }

        /* AND selector(two classes) on classes to increase specificity for color */
        .page-link.page-link-current, .page-link:hover, .page-link:active {
            background-color: #087f5b;
            color: #fff;
        }

        .dots {
            color: #868e96;
        }
    </style>
  </head>
  <body>
    <div class="pagination">
      <button class="pagination-btn">
        <svg class="pagination-btn-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
             stroke-width="1.5" stroke="currentColor">
          <path stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/>
        </svg>
      </button>
      <a href="#" class="page-link">1</a>
      <a href="#" class="page-link">2</a>
      <a href="#" class="page-link page-link-current">3</a>
      <a href="#" class="page-link">4</a>
      <a href="#" class="page-link">5</a>
      <a href="#" class="page-link">6</a>
      <span class="dots">...</span>
      <a href="#" class="page-link">23</a>
      <button class="pagination-btn">
        <svg class="pagination-btn-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
             stroke-width="1.5" stroke="currentColor">
          <path stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5"/>
        </svg>
      </button>
    </div>
  </body>
</html>
